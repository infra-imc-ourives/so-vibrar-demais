# Só Vibrar · configuração de entrega (Nginx)
#
# Trecho para colar dentro do bloco `server` do domínio. Faz o mesmo que o
# arquivo .htaccess: comprime o que é texto e manda o navegador guardar
# imagens e fontes por um ano.

# ---------------------------------------------------------------
# 1. Compressão
# ---------------------------------------------------------------
gzip              on;
gzip_vary         on;
gzip_min_length   256;
gzip_comp_level   6;
gzip_types        text/html text/css text/plain text/xml
                  application/javascript application/json image/svg+xml;

# WebP e woff2 ficam de fora de propósito: já vêm comprimidos.

# Se o módulo brotli estiver disponível, ele comprime melhor que o gzip.
# brotli            on;
# brotli_comp_level 5;
# brotli_types      text/html text/css application/javascript application/json image/svg+xml;

# ---------------------------------------------------------------
# 2. Cache
# ---------------------------------------------------------------
# Os nomes em /assets carregam o próprio conteúdo, então cache longo é
# seguro: se a imagem mudar, o nome muda junto.

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# O HTML precisa chegar atualizado quando a copy ou a oferta mudam.
location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
}

# ---------------------------------------------------------------
# 3. Tipos de arquivo
# ---------------------------------------------------------------
types {
    image/webp  webp;
    font/woff2  woff2;
}
